<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Check-in</title>
  <meta name="description" content="Quick mood check-in for team meetings.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%230078D6'/><circle cx='8.5' cy='10' r='1.5' fill='white'/><circle cx='15.5' cy='10' r='1.5' fill='white'/><path d='M7.5 14.5q4.5 4 9 0' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title" class="dialog-title">Reset check-in?</h2>
      <p id="confirm-body" class="dialog-body"></p>
      <div class="dialog-actions">
        <button class="btn btn-secondary" value="cancel">Cancel</button>
        <button class="btn btn-primary" value="ok" id="confirm-ok">Reset</button>
      </div>
    </form>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
